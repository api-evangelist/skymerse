name: Skymerse
description: >-
  Skymerse is a Y Combinator-backed aviation company building one AI system for
  airline flight operations — from planning and monitoring in the operations
  center to real-time support in the cockpit. Its first product, Notamify,
  interprets NOTAMs (Notices to Airmen) with specialized aeronautical models and
  ships the Notamify API V2: a REST API over global NOTAM data with AI-enhanced
  interpretation, active/nearby/raw/archive NOTAM endpoints, AI NOTAM
  prioritisation, synchronous and asynchronous flight briefings, and a Watcher
  API that pushes matching interpreted NOTAMs to signed webhooks. Notamify
  already serves airline customers and thousands of pilots and aviation
  professionals, with an official Python SDK and an MCP server for agents.
